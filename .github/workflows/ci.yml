# DevSecOps CI pipeline
# Runs on every push and pull request to main.
#
# Security gates ("shift-left" — catch issues before they reach production):
#   1. Lint        — ruff        (code quality)
#   2. Test        — pytest      (functionality)
#   3. SAST        — bandit      (static analysis of OUR code for security bugs)
#   4. Deps audit  — pip-audit   (known CVEs in third-party packages)
#   5. Secrets     — gitleaks    (accidentally committed credentials)
#   6. Container   — Trivy       (vulnerabilities in the Docker image)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest tests/ -v

  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      - run: bandit -r main.py

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # scan full history, not just the latest commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    name: Container scan (Trivy)
    runs-on: ubuntu-latest
    needs: [lint, test]  # only build the image if code passes
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t ingest-api:${{ github.sha }} .
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ingest-api:${{ github.sha }}
          format: table
          exit-code: "1"            # fail the build on findings
          severity: CRITICAL,HIGH   # only block on serious vulnerabilities
          ignore-unfixed: true      # don't fail on vulns with no available fix
